<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Tracker - PlacePro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="sidebar d-flex flex-column">
        <h3 class="text-center text-primary fw-bold my-3">PlacePro</h3>
        <a href="dashboard.html"><i class="bi bi-house-door"></i> Dashboard</a>
        <a href="companies.html"><i class="bi bi-building"></i> Companies</a>
        <a href="aptitude.html"><i class="bi bi-calculator"></i> Aptitude</a>
        <a href="coding.html"><i class="bi bi-code-slash"></i> Coding</a>
        <a href="learning.html"><i class="bi bi-book"></i> Learning</a>
        <a href="mock-interview.html"><i class="bi bi-person-video2"></i> Mock Interviews</a>
        <a href="progress.html" class="active"><i class="bi bi-graph-up"></i> Progress</a>
        <a href="#" onclick="logout()" class="mt-auto mb-3 text-danger"><i class="bi bi-box-arrow-right"></i> Logout</a>
    </div>

    <div class="main-content">
        <h2 class="mb-4 fw-bold">Analytics & Progress</h2>
        
        <!-- Interactive Top Metrics -->
        <div class="row g-4 mb-4" id="metricsGrid">
            <!-- Populated by JS -->
            <div class="text-center w-100"><span class="spinner-border text-primary"></span></div>
        </div>

        <!-- Charts -->
        <div class="row g-4 mb-4">
            <div class="col-md-5">
                <div class="card p-4 h-100" style="background: var(--card-bg); border: 1px solid var(--glass-border);">
                    <h5 class="fw-bold mb-3"><i class="bi bi-pie-chart text-primary me-2"></i> Skill Distribution</h5>
                    <div style="height: 250px;" class="d-flex justify-content-center">
                        <canvas id="readinessChart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-7">
                <div class="card p-4 h-100" style="background: var(--card-bg); border: 1px solid var(--glass-border);">
                    <h5 class="fw-bold mb-3"><i class="bi bi-graph-up text-success me-2"></i> Performance Over Time</h5>
                    <div style="height: 250px;">
                        <canvas id="performanceChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Recent Activity Timeline -->
        <div class="row">
            <div class="col-12">
                <div class="card p-4" style="background: var(--card-bg); border: 1px solid var(--glass-border);">
                    <h5 class="fw-bold mb-4"><i class="bi bi-clock-history text-warning me-2"></i> Recent Activity</h5>
                    <div class="list-group list-group-flush" id="timelineGrid">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const data = await fetchWithAuth('/student/progress');
            if (data) {
                renderMetrics(data.metrics);
                renderCharts(data);
                renderTimeline(data.history);
            }
        });

        function renderMetrics(metrics) {
            document.getElementById('metricsGrid').innerHTML = `
                <div class="col-md-3">
                    <div class="card p-3 text-center shadow-sm" style="background: rgba(99, 102, 241, 0.08); border: 1px solid rgba(99, 102, 241, 0.2); border-radius: 16px; transition: transform 0.3s;">
                        <i class="bi bi-star-fill mb-2" style="font-size: 2rem; color: #6366f1;"></i>
                        <h2 class="fw-bold mb-0" style="color: #6366f1;">${metrics.totalXP}</h2>
                        <span class="text-muted fw-bold">Total XP</span>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card p-3 text-center shadow-sm" style="background: rgba(16, 185, 129, 0.08); border: 1px solid rgba(16, 185, 129, 0.2); border-radius: 16px; transition: transform 0.3s;">
                        <i class="bi bi-code-slash mb-2" style="font-size: 2rem; color: #10b981;"></i>
                        <h2 class="fw-bold mb-0" style="color: #10b981;">${metrics.codingCount}</h2>
                        <span class="text-muted fw-bold">Problems Solved</span>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card p-3 text-center shadow-sm" style="background: rgba(14, 165, 233, 0.08); border: 1px solid rgba(14, 165, 233, 0.2); border-radius: 16px; transition: transform 0.3s;">
                        <i class="bi bi-person-video2 mb-2" style="font-size: 2rem; color: #0ea5e9;"></i>
                        <h2 class="fw-bold mb-0" style="color: #0ea5e9;">${metrics.mockCount}</h2>
                        <span class="text-muted fw-bold">Mock Interviews</span>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card p-3 text-center shadow-sm" style="background: rgba(244, 63, 94, 0.08); border: 1px solid rgba(244, 63, 94, 0.2); border-radius: 16px; transition: transform 0.3s;">
                        <i class="bi bi-calculator mb-2" style="font-size: 2rem; color: #f43f5e;"></i>
                        <h2 class="fw-bold mb-0" style="color: #f43f5e;">${metrics.aptitudeAccuracy}%</h2>
                        <span class="text-muted fw-bold">Aptitude Accuracy</span>
                    </div>
                </div>
            `;
        }

        function renderTimeline(history) {
            const grid = document.getElementById('timelineGrid');
            if(history.length === 0) {
                grid.innerHTML = '<p class="text-muted">No recent activity. Go take a test!</p>';
                return;
            }

            grid.innerHTML = history.slice(0, 8).map(h => {
                const dateObj = new Date(h.date);
                const isToday = new Date().toDateString() === dateObj.toDateString();
                const dateStr = isToday ? 'Today, ' + dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : dateObj.toLocaleDateString();
                
                let icon = 'bi-check-circle-fill';
                let color = '#6366f1'; // Indigo default
                
                if(h.type === 'Coding Challenge') { icon = 'bi-code-slash'; color = '#10b981'; } // Emerald
                if(h.type === 'Mock Interview') { icon = 'bi-person-video2'; color = '#0ea5e9'; } // Sky Blue
                if(h.type === 'Aptitude Test') { icon = 'bi-calculator'; color = '#f43f5e'; } // Rose/Pink

                return `
                    <div class="list-group-item d-flex justify-content-between align-items-center py-3" style="background: transparent; border-color: var(--glass-border);">
                        <div class="d-flex align-items-center">
                            <div style="width: 48px; height: 48px; border-radius: 12px; background: ${color}20; display: flex; align-items: center; justify-content: center; margin-right: 16px;">
                                <i class="bi ${icon} fs-4" style="color: ${color};"></i>
                            </div>
                            <div>
                                <h6 class="mb-0 fw-bold">${h.type}</h6>
                                <small class="text-muted">${dateStr}</small>
                            </div>
                        </div>
                        <span class="badge rounded-pill px-3 py-2 fs-6" style="background: ${color}; color: white; box-shadow: 0 4px 10px ${color}40;">+${h.score} Score</span>
                    </div>
                `;
            }).join('');
        }

        function renderCharts(data) {
            Chart.defaults.color = document.body.classList.contains('dark') ? '#f2f2f7' : '#1d1d1f';
            Chart.defaults.font.family = "'Inter', 'Segoe UI', sans-serif";
            
            // Doughnut Chart (Distribution of XP)
            let codeXP = 0, mockXP = 0, aptXP = 0;
            data.history.forEach(h => {
                if(h.type === 'Coding Challenge') codeXP += h.score;
                if(h.type === 'Mock Interview') mockXP += h.score;
                if(h.type === 'Aptitude Test') aptXP += h.score;
            });
            if(codeXP === 0 && mockXP === 0 && aptXP === 0) { aptXP = 1; } // Prevent empty chart crash

            const ctx1 = document.getElementById('readinessChart').getContext('2d');
            new Chart(ctx1, {
                type: 'doughnut',
                data: {
                    labels: ['Aptitude', 'Coding', 'Interviews'],
                    datasets: [{
                        data: [aptXP, codeXP, mockXP],
                        backgroundColor: ['#f43f5e', '#10b981', '#0ea5e9'],
                        borderWidth: 0,
                        hoverOffset: 8
                    }]
                },
                options: { 
                    maintainAspectRatio: false, 
                    plugins: { legend: { position: 'bottom', labels: { padding: 20, usePointStyle: true } } },
                    cutout: '70%'
                }
            });

            // Line Chart (Scores over last N attempts)
            const recentHist = [...data.history].reverse().slice(-10); // Last 10 attempts chronologically
            const labels = recentHist.map((_, i) => 'Attempt ' + (i+1));
            const scores = recentHist.map(h => h.score);

            const ctx2 = document.getElementById('performanceChart').getContext('2d');
            
            // Create gradient for line chart
            const gradient = ctx2.createLinearGradient(0, 0, 0, 300);
            gradient.addColorStop(0, 'rgba(99, 102, 241, 0.4)');
            gradient.addColorStop(1, 'rgba(99, 102, 241, 0.0)');

            new Chart(ctx2, {
                type: 'line',
                data: {
                    labels: labels.length ? labels : ['No Data'],
                    datasets: [{
                        label: 'Score per Test',
                        data: scores.length ? scores : [0],
                        borderColor: '#6366f1',
                        backgroundColor: gradient,
                        borderWidth: 3,
                        tension: 0.4,
                        fill: true,
                        pointBackgroundColor: '#ffffff',
                        pointBorderColor: '#6366f1',
                        pointBorderWidth: 2,
                        pointRadius: 5,
                        pointHoverRadius: 7
                    }]
                },
                options: { 
                    maintainAspectRatio: false, 
                    scales: { 
                        y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,0.05)' }, border: { display: false } },
                        x: { grid: { display: false }, border: { display: false } }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }
    </script>
</body>
</html>
