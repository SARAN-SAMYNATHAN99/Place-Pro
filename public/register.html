<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - PlacePro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card p-4" style="width: 400px;">
        <h3 class="text-center mb-4">Sign Up</h3>
        <form id="registerForm">
            <div class="mb-3">
                <label>Name</label>
                <input type="text" id="name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Email</label>
                <input type="email" id="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Password</label>
                <input type="password" id="password" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>College Name</label>
                <input type="text" id="college_name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Passing Year</label>
                <select id="passing_year" class="form-select" required>
                    <option value="" disabled selected>Select Year</option>
                    <option value="2024">2024</option>
                    <option value="2025">2025</option>
                    <option value="2026">2026</option>
                    <option value="2027">2027</option>
                    <option value="2028">2028</option>
                </select>
            </div>
            <div class="mb-4">
                <label>Target Domain</label>
                <select id="domainSelect" class="form-select" required onchange="toggleCustomDomain()">
                    <option value="" disabled selected>Select Domain</option>
                    <option value="Software Engineering">Software Engineering</option>
                    <option value="Cyber Security">Cyber Security</option>
                    <option value="Data Analyst">Data Analyst</option>
                    <option value="Salesforce">Salesforce</option>
                    <option value="Cloud Computing">Cloud Computing</option>
                    <option value="Other">Other (Type below)</option>
                </select>
                <input type="text" id="customDomain" class="form-control mt-2 d-none" placeholder="Enter your domain">
            </div>
            <button type="submit" class="btn btn-primary w-100">Register</button>
        </form>
        <p class="text-center mt-3">Already have an account? <a href="login.html">Login</a></p>
    </div>

    <script>
        function toggleCustomDomain() {
            const select = document.getElementById('domainSelect');
            const customInput = document.getElementById('customDomain');
            if (select.value === 'Other') {
                customInput.classList.remove('d-none');
                customInput.required = true;
            } else {
                customInput.classList.add('d-none');
                customInput.required = false;
            }
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const college_name = document.getElementById('college_name').value;
            const passing_year = document.getElementById('passing_year').value;
            
            let domain = document.getElementById('domainSelect').value;
            if (domain === 'Other') {
                domain = document.getElementById('customDomain').value;
            }

            const res = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password, college_name, passing_year, domain })
            });
            const data = await res.json();
            if (res.ok) {
                alert('Registered successfully! Please login.');
                window.location.href = 'login.html';
            } else {
                alert(data.error);
            }
        });
    </script>
</body>
</html>
